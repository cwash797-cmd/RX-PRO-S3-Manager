name: Manager safety and installation tests
on:
  push:
    branches: [genspark_ai_developer, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manager-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Native transport and S3 race suite
        run: python3 native/build.py test
      - name: Build server-only bridge
        run: python3 native/build.py linux
      - name: Verify unchanged 1.6.0 client interoperability
        run: |
          mkdir -p .lab/legacy
          curl -fL --proto '=https' --proto-redir '=https' https://github.com/cwash797-cmd/RX-PRO/releases/download/1.6.0/s3_rixxx_server_linux_amd64_1.6.0.tar.gz -o .lab/legacy/client.tar.gz
          echo '5c25988b6878a0adc0300521f2c428febc90cd52aeaa6a5b9e463fc8f1db4618  .lab/legacy/client.tar.gz' | sha256sum -c -
          tar -xzf .lab/legacy/client.tar.gz -C .lab/legacy
          python3 native/integration.py --client .lab/legacy/xray-s3 --server .lab/native/bin/xray-s3
      - name: Package native bridge twice identically
        run: |
          python3 native/package.py
          cp .lab/native/dist/SHA256SUMS.bridge .lab/native/expected.sha
          python3 native/package.py
          cmp .lab/native/expected.sha .lab/native/dist/SHA256SUMS.bridge
          python3 - <<'PY'
          from pathlib import Path
          from rxs3.pins import CORE_SHA
          actual = Path('.lab/native/dist/SHA256SUMS.bridge').read_text().split()[0]
          assert actual == CORE_SHA, 'Rebuilt bridge differs from the published manager pin'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-bridge-linux-amd64
          path: .lab/native/dist/*
          if-no-files-found: error
  ubuntu-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-cryptography python3-qrcode iproute2 ca-certificates curl
      - name: Unit and security tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Reproducible release and clean installation
        run: |
          /usr/bin/python3 build_release.py
          mkdir -p .lab/release
          version=$(/usr/bin/python3 -c 'from rxs3 import __version__; print(__version__)')
          release="rx-pro-s3-manager-$version"
          tar -xzf "dist/$release.tar.gz" -C .lab/release
          echo "RXS3_RELEASE_PATH=$PWD/.lab/release/$release" >> "$GITHUB_ENV"
          cd ".lab/release/$release"
          sha256sum -c SHA256SUMS
          sudo /usr/bin/python3 install.py --check
          sudo bash -c 'umask 077; /usr/bin/python3 install.py --fresh-panel'
      - name: Real systemd bootstrap and existing-panel compatibility (mock VK)
        env:
          RXS3_ALLOW_INSTALL_TEST: github-disposable-runner
        run: sudo --preserve-env=GITHUB_ACTIONS,RXS3_ALLOW_INSTALL_TEST /usr/bin/python3 tests/installed_smoke.py
      - name: Reinstall preserves panel and state
        run: |
          sudo sha256sum /var/lib/rxs3/config.json > .lab/config-before.sha
          sudo /usr/bin/python3 "$RXS3_RELEASE_PATH/install.py" --fresh-panel
          sudo sha256sum -c .lab/config-before.sha
          sudo rxs3 sync
          sudo systemctl is-active x-ui rxs3-sync.timer
      - name: Standalone real panel API contracts in private network
        run: |
          mkdir -p .lab/x-ui/bin
          sudo cp /usr/local/x-ui/x-ui .lab/x-ui/x-ui
          sudo cp /usr/local/x-ui/bin/xray-linux-amd64 .lab/x-ui/bin/
          sudo unshare --net -- bash -c 'ip link set lo up; /usr/bin/python3 tests/integration_panel.py'
      - name: Upload source-only test bundle
        uses: actions/upload-artifact@v4
        with:
          name: manager-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  debian-unit:
    runs-on: ubuntu-24.04
    container: debian:12
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y python3 python3-cryptography python3-qrcode
      - run: python3 -m unittest discover -s tests -v
